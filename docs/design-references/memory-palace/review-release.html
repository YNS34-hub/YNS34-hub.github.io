<main>
  <h1>The Memory Palace · 已发布主分支 → 视觉升级</h1>
  <p>15组真实浏览器截图。左侧为发布前主分支，右侧为本次整合版本；匹配相机和画质。拖动滑杆或用方向键比较。</p>
  <div class="tools">
    <label for="scene">场景 <select id="scene"></select></label>
    <label for="amount">改动前占比 <input id="amount" type="range" min="0" max="100" value="50"><output id="value" for="amount">50%</output></label>
  </div>
  <div class="comparison" id="comparison">
    <img id="after" alt="改动后的场景，同一相机和画质">
    <img id="before" class="before" alt="改动前的场景，同一相机和画质">
    <div class="divider" id="divider"></div><span class="badge left">改动前</span><span class="badge right">当前候选</span>
  </div>
  <p id="details" class="note"></p>
  <p class="note">完整实现、验证、测量限制与参考用途见 <a href="RELEASE_20261101.md">发布整合记录</a>。概念板与独立建筑研究图仍是文档参考，没有作为展品或场景背景使用。</p>
</main>
